# Gateway portal (mount thành /etc/nginx/conf.d/default.conf, nằm trong khối http{}).
server_tokens off;

# --- IP khách thật. Chỉ tin CF-Connecting-IP khi kết nối đến từ gateway của mạng `edge` (subnet ghim trong
# docker-compose.yml: 10.213.77.0/24, gateway 10.213.77.1). cloudflared chạy trên host, vào qua 127.0.0.1:GATEWAY_PORT
# -> gateway thấy nguồn là 10.213.77.1. Không tin cả dải 10/8, 172.16/12, 192.168/16: container khác cùng host (hay
# máy LAN nếu ai đó lỡ publish ra ngoài 127.0.0.1) không giả được IP. TUYỆT ĐỐI không publish cổng gateway ra
# ngoài 127.0.0.1: mọi kết nối từ ngoài qua cổng publish đều trông như từ 10.213.77.1 và giả được header này.
real_ip_header CF-Connecting-IP;
real_ip_recursive off;
set_real_ip_from 10.213.77.1;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

# nginx chỉ phân giải tên `portal` một lần lúc khởi động nếu proxy_pass viết cứng: portal tạo lại (cap-nhat, rollback,
# restart) mà đổi IP thì gateway trả 502 mãi. Dùng DNS nội bộ của docker (127.0.0.11) + biến để phân giải lại.
# Không có phần URI trong proxy_pass nên URI gốc của client được chuyển nguyên dạng.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    set $portal_upstream http://portal:3100;
    listen 80 default_server;
    server_name _;

    client_max_body_size 2m;           # mặc định cho API thường (JSON, ghi chú)
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 60s;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_redirect off;

    # Healthcheck riêng của gateway (không đi qua portal).
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # /api/health: chỉ mở cho kiểm tra nội bộ. Tunnel Cloudflare luôn gắn CF-Connecting-IP (IP công cộng) nên khách
    # ngoài bị 403; curl từ host/docker (không có header đó) thấy $remote_addr là IP riêng và được qua.
    # Lý do chặn: lộ trạng thái DB cho người lạ không có ích gì, chỉ giúp dò.
    location = /api/health {
        allow 10.213.77.1;   # curl từ host (không CF-Connecting-IP) đi vào bằng gateway của mạng edge
        deny all;
        proxy_pass $portal_upstream;
        include /etc/nginx/proxy_headers.inc;
    }

    # Upload tệp (route nhận tới 120 MB theo yêu cầu thiết kế; ứng dụng tự giới hạn 50 MB/tệp): không đệm body ở nginx.
    location ~ ^/api/items/[^/]+/files/?$ {
        client_max_body_size 130m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass $portal_upstream;
        include /etc/nginx/proxy_headers.inc;
    }

    # Tải/xem tệp: không đệm response lớn vào đĩa nginx.
    location /api/files/ {
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass $portal_upstream;
        include /etc/nginx/proxy_headers.inc;
    }

    # Tool khác (cấu hình, tắt mặc định): nginx/conf.d/tools/*.conf. Xem nginx/conf.d/tools/auto-pull-nas.conf.example
    # (/auto-pull-nas/ -> host.docker.internal:18780, KHÔNG qua xác thực portal; frontend auto-pull-nas CHƯA có base path, chỉ bật sau khi
    # PR base path của repo đó được merge).
    include /etc/nginx/conf.d/tools/*.conf;

    location / {
        proxy_pass $portal_upstream;
        include /etc/nginx/proxy_headers.inc;
    }
}
