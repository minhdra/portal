# Gateway portal (mount thành /etc/nginx/conf.d/default.conf, nằm trong khối http{}).
server_tokens off;
absolute_redirect off;   # mọi redirect do nginx sinh ra là tương đối (không mất cổng/https, không phản chiếu Host)

# --- IP khách thật. Chuỗi: Internet -> proxy ở router 192.168.10.1 (kết thúc TLS, ĐẶT/NỐI X-Forwarded-For với địa chỉ
# nó thấy) -> gateway này (nghe trên IP LAN của máy, GATEWAY_BIND). Chỉ tin X-Forwarded-For khi kết nối đến từ đúng
# 192.168.10.1 và lấy phần tử CUỐI (real_ip_recursive off): phần tử đầu do client tự gửi nên bị bỏ qua.
# Máy khác trong LAN nối thẳng vào gateway: nguồn không phải 192.168.10.1 nên header bị bỏ qua (không giả được IP).
# Nếu thay proxy phía trước (đổi IP / dùng Cloudflare tunnel): sửa 2 dòng dưới cho khớp và đọc docs/DEPLOY.md mục 7.
real_ip_header X-Forwarded-For;
real_ip_recursive off;
set_real_ip_from 192.168.10.1;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

# nginx chỉ phân giải tên `portal` một lần lúc khởi động nếu proxy_pass viết cứng: portal tạo lại (cap-nhat, rollback,
# restart) mà đổi IP thì gateway trả 502 mãi. Dùng DNS nội bộ của docker (127.0.0.11) + biến để phân giải lại.
# Không có phần URI trong proxy_pass nên URI gốc của client được chuyển nguyên dạng.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    set $portal_upstream http://portal:3100;
    listen 80 default_server;
    server_name _;

    client_max_body_size 2m;           # mặc định cho API thường (JSON, ghi chú)
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 60s;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_redirect off;

    # Healthcheck riêng của gateway (không đi qua portal).
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # /api/health: chỉ mở cho kiểm tra nội bộ (curl từ chính máy này qua mạng edge). Khách ngoài vào qua proxy 192.168.10.1
    # nên $remote_addr là IP khách thật (đã qua real_ip) và bị 403.
    # Lý do chặn: lộ trạng thái DB cho người lạ không có ích gì, chỉ giúp dò.
    location = /api/health {
        allow 10.213.77.1;   # kết nối từ host tới gateway qua mạng edge
        allow 192.168.10.240; # curl từ chính máy này tới IP LAN của gateway (DNAT giữ nguồn)
        deny all;
        proxy_pass $portal_upstream;
        include /etc/nginx/proxy_headers.inc;
    }

    # Upload tệp (route nhận tới 120 MB theo yêu cầu thiết kế; ứng dụng tự giới hạn 50 MB/tệp): không đệm body ở nginx.
    location ~ ^/api/items/[^/]+/files/?$ {
        client_max_body_size 130m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass $portal_upstream;
        include /etc/nginx/proxy_headers.inc;
    }

    # Tải/xem tệp: không đệm response lớn vào đĩa nginx.
    location /api/files/ {
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass $portal_upstream;
        include /etc/nginx/proxy_headers.inc;
    }

    # Tool khác (mỗi tool một file *.conf): nginx/conf.d/tools/*.conf. Mẫu đang dùng: nginx/conf.d/tools/auto-pull-nas.conf
    # (/auto-pull-nas/ -> host.docker.internal:18781, KHÔNG qua xác thực portal; web auto-pull-nas build với WEB_BASE_PATH=/auto-pull-nas/).
    include /etc/nginx/conf.d/tools/*.conf;

    location / {
        proxy_pass $portal_upstream;
        include /etc/nginx/proxy_headers.inc;
    }
}
