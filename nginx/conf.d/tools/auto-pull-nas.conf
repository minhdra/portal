# Tool phía sau gateway: auto-pull-nas (frontend build với WEB_BASE_PATH=/auto-pull-nas/, xem repo auto-pull-nas-hy PR #1).
# Dấu "/" cuối ở proxy_pass là bắt buộc: nginx cắt tiền tố /auto-pull-nas/ -> web nhận /api/..., /assets/...
# Upstream tĩnh, không dùng biến (biến + "/" cuối KHÔNG cắt tiền tố).
# AN NINH: /auto-pull-nas/ KHÔNG đi qua xác thực portal; auto-pull-nas tự có đăng nhập riêng (auth_required).
location = /auto-pull-nas { return 301 /auto-pull-nas/; }
location /auto-pull-nas/ {
    proxy_pass http://host.docker.internal:18781/;
    include /etc/nginx/proxy_headers.inc;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 130m;
    proxy_http_version 1.1;
}
