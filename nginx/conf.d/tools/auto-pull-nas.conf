# Tool phía sau gateway: auto-pull-nas (frontend build với WEB_BASE_PATH=/auto-pull-nas/, xem repo auto-pull-nas-hy PR #1).
# Dấu "/" cuối ở proxy_pass là bắt buộc: nginx cắt tiền tố /auto-pull-nas/ -> web nhận /api/..., /assets/...
# Upstream tĩnh, không dùng biến (biến + "/" cuối KHÔNG cắt tiền tố).
# AN NINH:
#  - /auto-pull-nas/ KHÔNG đi qua xác thực portal; auto-pull-nas tự có đăng nhập riêng (cookie apn_session HttpOnly sau PR #2; trước đó là token trong localStorage).
#  - CÙNG ORIGIN với portal (cùng tên miền): XSS ở bên này vẫn gọi được API bên kia bằng phiên đang mở (cookie HttpOnly chỉ chặn ĐỌC token). Giảm thiểu: header
#    an ninh bên dưới, không chuyển cookie portal sang auto-pull-nas, và portal giữ lọc nội dung. Tốt nhất về sau tách subdomain.
#  - Gateway không thêm CSP cho auto-pull-nas (chưa thử với CSV/blob tải về); thêm sau khi kiểm bằng trình duyệt.
location = /auto-pull-nas {
    absolute_redirect off;     # Location tương đối: không mất cổng/https, không phản chiếu Host
    return 301 /auto-pull-nas/;
}
location /auto-pull-nas/ {
    proxy_pass http://host.docker.internal:18781/;
    include /etc/nginx/proxy_headers.inc;
    proxy_set_header Cookie "apn_session=$cookie_apn_session";   # chỉ chuyển cookie phiên của auto-pull-nas; cookie portal (__Host-portal_session) bị bỏ
    proxy_redirect ~^https?://[^/]+/(.*)$ /auto-pull-nas/$1;   # redirect tuyệt đối do web nginx của auto-pull-nas sinh ra
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 2m;                    # auto-pull-nas không nhận upload tệp lớn; không cho người chưa đăng nhập đẩy body lớn vào gateway
    proxy_request_buffering off;
    proxy_http_version 1.1;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
