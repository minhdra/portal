# Dựng bằng: docker compose up -d   (cần .env, xem docs/DEPLOY.md)
name: portal

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    <<: *hardening
    # 16.15-alpine (digest = ảnh đã kiểm thử). Nâng cấp: đổi cả tag lẫn digest, xem docs/DEPLOY.md mục "Ghim ảnh".
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_DB: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}
    mem_limit: 1g
    pids_limit: 256
    volumes:
      - pgdata:/var/lib/postgresql/data
    # postgres cần chown/gosu lúc khởi động
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [portal]
    # KHÔNG publish cổng ra host.

  migrate:
    <<: *hardening
    build: { context: ., target: migrate }
    image: ${COMPOSE_PROJECT_NAME:-portal}-migrate:latest
    restart: "no"
    # Chỉ các biến migrate+seed cần (không env_file: tránh lộ SESSION_SECRET, BACKUP_*...).
    environment:
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}@postgres:5432/portal
      ADMIN_USER: ${ADMIN_USER:?đặt ADMIN_USER trong .env}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?đặt ADMIN_INITIAL_PASSWORD trong .env}
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp", "/home/node/.npm"]
    networks: [portal]

  portal:
    <<: *hardening
    build: { context: ., target: runner }
    image: ${COMPOSE_PROJECT_NAME:-portal}-app:latest
    restart: unless-stopped
    # Chỉ biến thật sự đọc trong src/ (grep process.env). Không có POSTGRES_PASSWORD (ngoài DATABASE_URL),
    # ADMIN_INITIAL_PASSWORD, BACKUP_*.
    environment:
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}@postgres:5432/portal
      SESSION_SECRET: ${SESSION_SECRET:?đặt SESSION_SECRET trong .env}
      COOKIE_SECURE: "1"
      NODE_ENV: production
      UPLOAD_DIR: /data/uploads
      UV_THREADPOOL_SIZE: "8"
      TRUST_PROXY: "1"
      CLIENT_IP_HEADER: x-client-ip
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes:
      - uploads:/data/uploads
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 1g
    cpus: 2
    pids_limit: 512
    networks: [portal]
    # KHÔNG publish cổng; chỉ gateway tới được (portal:3100).

  gateway:
    <<: *hardening
    # 1.27.5-alpine (digest = ảnh đã kiểm thử). Xem docs/DEPLOY.md mục "Ghim ảnh".
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    # nginx master cần các quyền này để chown thư mục tạm, hạ quyền worker, bind :80
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-18790}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/portal.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_headers.inc:/etc/nginx/proxy_headers.inc:ro
      - ./nginx/conf.d/tools:/etc/nginx/conf.d/tools:ro
    depends_on:
      portal: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [portal, edge]

  backup:
    <<: *hardening
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    # chạy bằng uid của chủ thư mục BACKUP_DIR (mặc định 1000, trùng user node của portal để đọc uploads)
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    # uploads do portal (uid/gid 1000) tạo với mode 0750/0640: đọc được nhờ nhóm 1000 dù BACKUP_UID khác
    group_add: ["1000"]
    entrypoint: ["/bin/sh", "/scripts/backup.sh", "--loop"]
    environment:
      PGHOST: postgres
      PGUSER: portal
      PGDATABASE: portal
      # RỦI RO CÒN LẠI: mật khẩu DB nằm trong env của backup (thấy qua `docker inspect`/docker group). Compose không cho
      # secret từ biến môi trường vào service read_only ("`file` is the sole supported option"); dùng secret dạng file
      # cần thêm bước tạo tệp mật khẩu ngoài .env. Chấp nhận: người đọc được inspect đã có quyền docker (= root host).
      PGPASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      IN_BACKUP_CONTAINER: "1"
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads:/data/uploads:ro
      - ./scripts:/scripts:ro   # thư mục (không phải 1 file) để sửa script trên host thì container thấy ngay
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 256m
    pids_limit: 128
    networks: [portal]

networks:
  portal:
    internal: true   # portal/postgres/backup không ra Internet, không với tới từ host
  # gateway: publish ${GATEWAY_BIND}:${GATEWAY_PORT} và tới host.docker.internal. Subnet GHIM cứng: 10.213.77.1 là nơi kết nối
  # từ chính máy host đi vào (dùng cho `allow` của /api/health trong nginx/portal.conf; IP khách thật tin ở set_real_ip_from).
  # Đổi dải => sửa allow trong nginx/portal.conf. Dải này không trùng mạng docker/route đang có (kiểm lúc viết).
  edge:
    ipam:
      config:
        - subnet: 10.213.77.0/24
          gateway: 10.213.77.1

volumes:
  pgdata: {}
  uploads: {}
